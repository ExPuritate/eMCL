[package]
name = "emcl_core"
version.workspace = true
edition.workspace = true

[workspace]
members = ["crates/*"]
package.version = "0.1.0"
package.edition = "2024"

[dependencies]
anyhow = "1.0.104"
getset = "0.1.7"
iso8601-timestamp = "0.4.0"
jni = { version = "0.22.4", features = ["invocation"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
subst = "0.3.8"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
	"Win32_System_LibraryLoader",
	"Win32_Foundation",
] }
windows-version = { version = "0.100.0" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191" }

[dev-dependencies]
rand = "0.10.3"
